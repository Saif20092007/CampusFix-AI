<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Tech Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Container Shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#shieldGrad)" filter="url(#logoShadow)" />
  <rect x="7" y="7" width="106" height="106" rx="25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- College Crest / Classical Portico Arch Outline in White -->
  <!-- Top Roof Triangle / Pediment -->
  <path d="M60 22 L88 36 H32 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Architrave Base under Pediment -->
  <rect x="30" y="38" width="60" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.95" />

  <!-- 4 Classical Campus Pillars -->
  <rect x="34" y="44" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.85" />
  <rect x="48" y="44" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.85" />
  <rect x="66" y="44" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.85" />
  <rect x="80" y="44" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.85" />

  <!-- Pedestal / Base Platform -->
  <rect x="28" y="74" width="64" height="4" rx="2" fill="#ffffff" fill-opacity="0.95" />

  <!-- Dynamic Fix Lightning / Bolt & Wrench Accent in Gold with Glow -->
  <!-- Bold Sharp Lightning Bolt that overlaps the columns dynamically -->
  <path d="M66 40 L45 68 H59 L52 98 L78 62 H63 L72 40 Z" fill="url(#goldGrad)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" />

  <!-- AI Spark / Star in Top Right -->
  <path d="M84 20 Q84 26 90 26 Q84 26 84 32 Q84 26 78 26 Q84 26 84 20 Z" fill="url(#sparkGrad)" />

  <!-- AI Spark / Dot in Top Left -->
  <circle cx="28" cy="28" r="2.5" fill="#67e8f9" />
</svg>
