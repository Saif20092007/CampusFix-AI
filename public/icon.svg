<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f78f8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Electric Bolt Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#shieldGrad)" filter="url(#logoShadow)" />

  <!-- College Crest / Classical Portico Pediment in Pure White -->
  <path d="M60 23 L88 36 H32 Z" fill="#ffffff" />
  <rect x="30" y="38" width="60" height="3.5" rx="1.75" fill="#ffffff" />

  <!-- 4 Classical Campus Pillars -->
  <rect x="35" y="44" width="5.5" height="26" rx="2.5" fill="#ffffff" />
  <rect x="49" y="44" width="5.5" height="26" rx="2.5" fill="#ffffff" />
  <rect x="65" y="44" width="5.5" height="26" rx="2.5" fill="#ffffff" />
  <rect x="79" y="44" width="5.5" height="26" rx="2.5" fill="#ffffff" />

  <!-- Pedestal / Base Platform -->
  <rect x="29" y="73" width="62" height="4" rx="2" fill="#ffffff" />

  <!-- Dynamic Electric Bolt in Golden Yellow with Dark Outline -->
  <path
    d="M62 34 L45 54 H56 L47 84 L68 50 H57 L62 34 Z"
    fill="url(#goldGrad)"
    stroke="#1e293b"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Sparkles: Cyan dot on top-left and 4-point star on top-right -->
  <circle cx="32" cy="26" r="2.8" fill="#38bdf8" />
  <path d="M88 19 Q88 25 94 25 Q88 25 88 31 Q88 25 82 25 Q88 25 88 19 Z" fill="#ffffff" />
</svg>
